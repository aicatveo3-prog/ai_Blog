<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector 운영 대시보드</title>
<style>
  /* Apple-style light (default). Dark only when :root[data-theme="dark"]. */
  :root{
    --bg:#F5F5F7; --ink:#1D1D1F; --accent:#4B47E8; --muted:#86868B;
    --line:#E4E4E8; --card:#FFFFFF; --soft:#F5F5F7; --ok:#1D9D6B;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"]{
    --bg:#0B0B0D; --ink:#F5F5F7; --accent:#8C89FF; --muted:#98989F;
    --line:#2A2A30; --card:#1C1C1F; --soft:#2A2A2E; --ok:#3FCF92;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .themebtn{margin-left:auto;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
    color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:16px;padding:0;box-shadow:var(--shadow)}
  .themebtn:hover{border-color:var(--accent)}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);position:relative;flex:none}
  .logo::before{content:"";position:absolute;left:8px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--bg)}
  .logo::after{content:"";position:absolute;right:7px;top:10px;width:8px;height:11px;border-radius:3px;background:var(--accent)}
  h1{font-size:20px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 26px}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:30px 0 14px;font-weight:600}
  .h2sub{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}

  /* tabs */
  .tabs{display:flex;gap:6px;margin:22px 0 6px;border-bottom:1px solid var(--line)}
  .tab{font:inherit;cursor:pointer;background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--ink)}
  .tabpanel[hidden]{display:none}

  /* calendar controls */
  .calhint{font-size:12.5px;color:var(--muted);margin:16px 0 12px}
  .calctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
  .viewtoggle{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
  .vtg{font:inherit;cursor:pointer;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px}
  .vtg.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .navrow{display:flex;align-items:center;gap:6px}
  .navbtn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
    width:34px;height:34px;border-radius:9px;font-size:13px;font-weight:600;padding:0}
  .navbtn.today{width:auto;padding:0 12px}
  .navbtn:hover{border-color:var(--accent);color:var(--accent)}
  .callabel{font-size:15px;font-weight:700;min-width:130px;text-align:center}

  /* month grid */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .mwd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
  .mwd.sun{color:#d06666}
  .cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 5px 6px;overflow:hidden}
  .cell.off{background:transparent;border-color:transparent}
  .cell .dn{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
  .cell.off .dn{opacity:.35}
  .cell.today0{border-color:var(--accent)}
  .chip{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;border:none;border-radius:6px;
    padding:3px 6px;margin-bottom:3px;font-size:11px;font-weight:600;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.art{background:rgba(75,71,232,.14);color:var(--accent);font-weight:700;border-left:3px solid var(--accent)}
  .chip.ok{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
  .chip.warn{background:rgba(210,150,0,.14);color:#b8860b}
  .callegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:0 0 14px}
  .callegend span{display:inline-flex;align-items:center;gap:5px}
  .lgd{width:16px;height:12px;border-radius:4px;display:inline-block}
  .lgd.art{background:rgba(75,71,232,.2);border-left:3px solid var(--accent)}
  .lgd.ok{background:var(--soft);border:1px solid var(--line)}
  .lgd.warn{background:rgba(210,150,0,.2)}

  /* week view */
  .wgrid{display:flex;flex-direction:column;gap:6px}
  .wday{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .wday.sun .wh{color:#d06666}
  .wh{flex:none;width:74px;font-size:13px;font-weight:700}
  .wh small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .witems{flex:1;display:flex;flex-direction:column;gap:5px}
  .wempty{color:var(--muted);opacity:.5}
  .chip.wk{white-space:normal}

  /* item detail (popup) + shared badges */
  .idetail .drow{margin:8px 0;font-size:13.5px}
  .idetail .glab{color:var(--muted);font-size:12px}
  .idetail .gap b{color:var(--accent)}
  .idetail .note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0;line-height:1.6}
  .idetail .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}
  .idetail a.src{color:var(--accent);font-weight:600}
  .vchk{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .vchk.ok{background:rgba(31,157,107,.15);color:var(--ok)}
  .vchk.warn{background:rgba(210,150,0,.16);color:#b8860b}
  .st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--ink)}
  .st.검수중{background:var(--accent);color:#fff}
  .st.폐기{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .st.인박스{background:transparent;color:#b8860b;border:1px solid #d9c58a}
  .caltag{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:6px}
  .undated{margin-top:22px}
  .ulabel{font-size:13px;font-weight:600;margin-bottom:10px}
  .uchips{display:flex;flex-wrap:wrap;gap:7px}

  .critbar{display:flex;flex-wrap:wrap;gap:8px}
  .critbtn{font:inherit;cursor:pointer;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s}
  .critbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* pipeline */
  .pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .step{flex:1;min-width:88px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;position:relative}
  .step .n{font-size:11px;color:var(--muted)}
  .step .name{font-size:13.5px;font-weight:600;margin-top:2px}
  .step .cnt{margin-top:8px;font-size:12px;color:var(--accent);font-weight:600;min-height:16px}
  .step.auto{border-style:dashed}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ink)}
  .badge.stage{background:var(--accent);color:#fff}
  .badge.date{background:transparent;color:var(--muted);padding-left:0}
  .card h3{font-size:17px;letter-spacing:-.2px;margin:2px 0 8px;line-height:1.4}
  .angle{font-size:13.5px;color:var(--muted);background:var(--soft);border-left:3px solid var(--accent);
    padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0 14px}
  .lens{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  .empty{color:var(--muted);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}

  /* reader overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
    display:none;align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow-y:auto}
  .overlay.on{display:flex}
  .reader{background:var(--bg);max-width:760px;width:100%;border-radius:18px;border:1px solid var(--line);
    padding:0;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .reader .rhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-radius:18px 18px 0 0}
  .reader .rhead .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px}
  .close{border:none;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;padding:0}
  .vbar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
  .vchip{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .vchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vchip:hover{border-color:var(--accent);color:var(--accent)}
  .vchip.on:hover{color:#fff}
  .vnote{display:none;margin:10px 20px 0;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
  .doc{padding:24px 26px 40px}
  .doc h1{font-size:23px;line-height:1.35;margin:6px 0 16px;letter-spacing:-.3px}
  .doc h2{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);margin:24px 0 8px}
  .doc h3{font-size:14.5px;margin:18px 0 6px}
  .doc p{margin:10px 0}
  .doc ul,.doc ol{margin:10px 0 10px 22px}
  .doc li{margin:4px 0}
  .doc a{color:var(--accent)}
  .doc code{background:var(--soft);padding:2px 6px;border-radius:5px;font-size:.9em}
  .doc pre{background:var(--soft);padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0}
  .doc pre code{background:none;padding:0}
  .doc blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:12px 0;color:var(--muted);background:var(--soft);border-radius:0 8px 8px 0}
  .doc hr{border:none;border-top:1px solid var(--line);margin:20px 0}
  .doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  .doc th{background:var(--soft)}
  .doc .fm{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 14px;margin-bottom:16px}

  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--muted)}
  .loading{color:var(--muted);font-size:14px;padding:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div>
      <h1>Vector 운영 대시보드</h1>
    </div>
    <button class="themebtn" id="themeBtn" title="라이트/다크 전환">☀️</button>
  </header>
  <div class="sub mono" id="updated">불러오는 중…</div>

  <div class="tabs">
    <button class="tab on" data-tab="overview">개요</button>
    <button class="tab" data-tab="calendar">📅 수집 달력</button>
  </div>

  <section id="tab-overview" class="tabpanel">
    <h2>파이프라인</h2>
    <div class="pipe" id="pipe"></div>

    <h2>판단 기준 <span class="h2sub">— 매번 이 규칙으로 판단합니다</span></h2>
    <div class="critbar" id="criteria"></div>

    <h2>글 목록</h2>
    <div id="list"><div class="loading">불러오는 중…</div></div>
  </section>

  <section id="tab-calendar" class="tabpanel" hidden>
    <p class="calhint">날짜 = 검증된 <b>진짜 첫 등장일</b> (뉴스 뜬 날이 아님).</p>
    <div class="calctl">
      <div class="viewtoggle">
        <button class="vtg on" data-view="month">월별</button>
        <button class="vtg" data-view="week">주간</button>
      </div>
      <div class="navrow">
        <button class="navbtn" id="calPrev">◀</button>
        <span id="calLabel" class="callabel"></span>
        <button class="navbtn" id="calNext">▶</button>
        <button class="navbtn today" id="calToday">최근</button>
      </div>
    </div>
    <div class="callegend">
      <span><i class="lgd art"></i>📄 정리 글 작성됨 (클릭해 읽기)</span>
      <span><i class="lgd ok"></i>수집만 (요약 카드)</span>
      <span><i class="lgd warn"></i>⚠️ 날짜 미검증</span>
    </div>
    <div id="calview"></div>
    <div class="undated">
      <div class="ulabel">📌 날짜 없음 <span class="h2sub">— 트렌드 · 미검증</span></div>
      <div id="calUndated"></div>
    </div>
  </section>

  <footer>
    수집 → 선별 → 조사 → 관점 → 초안 → 검수 → 발행 · Vector 운영 시스템<br>
    <a href="index.html">← 블로그 사이트로</a>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="reader">
    <div class="rhead"><span class="k" id="rkind"></span><button class="close" id="close">×</button></div>
    <div class="vbar" id="vbar"></div>
    <div class="vnote" id="vnote"></div>
    <div class="doc" id="doc"><div class="loading">불러오는 중…</div></div>
  </div>
</div>

<script>
const overlay = document.getElementById('overlay');
const docEl = document.getElementById('doc');
const rkind = document.getElementById('rkind');

// 테마 (기본: 애플풍 라이트. 선택은 localStorage에 저장)
(function(){
  const root=document.documentElement, btn=document.getElementById('themeBtn');
  function apply(t){ if(t==='dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    btn.textContent = t==='dark' ? '🌙' : '☀️'; }
  let t = localStorage.getItem('vec-theme') || 'light';
  apply(t);
  btn.onclick=()=>{ t=(t==='dark'?'light':'dark'); localStorage.setItem('vec-theme',t); apply(t); };
})();

// 데이터는 raw.githubusercontent에서 읽는다 (GitHub Pages 빌드 대기 없이 몇 초 안에 반영).
// 브랜치를 바꾸면 아래 한 줄만 수정. raw가 막히면(비공개 저장소 등) 자동으로 Pages 상대경로로 폴백.
const RAW_BASE = 'https://raw.githubusercontent.com/aicatveo3-prog/ai_Blog/claude/github-upload-setup-vimtlp/';
let RAW_OK = null;   // null=미판정, true=raw 사용, false=폴백만 (첫 요청에서 한 번만 판정)
async function fetchData(path){
  const bust = (path.includes('?')?'&':'?') + 't=' + Date.now();
  if(RAW_OK === false) return fetch(path + bust, {cache:'no-store'});   // 이미 raw 불가로 판정됨
  try{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 4000);
    const r = await fetch(RAW_BASE + path + bust, {cache:'no-store', signal: ctl.signal});
    clearTimeout(timer);
    if(r.ok){ RAW_OK = true; return r; }
    throw new Error(r.status);
  }catch(_){
    RAW_OK = false;
    return fetch(path + bust, {cache:'no-store'});   // 폴백: Pages 상대경로
  }
}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// inline: code, links (markdown + bare url autolink), bold, italic (no external deps)
function inline(s){
  const codes=[], links=[];
  s = esc(s).replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '␞C'+(codes.length-1)+'␞';});
  // markdown links [text](url) first
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>{
    links.push('<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
    return '␞L'+(links.length-1)+'␞';
  });
  // then autolink any remaining bare http(s) urls
  s = s.replace(/(https?:\/\/[^\s<>()]+[^\s<>().,;:])/g,(m)=>{
    links.push('<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
    return '␞L'+(links.length-1)+'␞';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/␞C(\d+)␞/g,(m,i)=>'<code>'+codes[+i]+'</code>');
  s = s.replace(/␞L(\d+)␞/g,(m,i)=>links[+i]);
  return s;
}
function splitRow(line){
  return line.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
}
// self-contained markdown renderer (headings, hr, code, quote, tables, lists, paragraphs)
function renderMD(md){
  const lines = md.replace(/\r/g,'').split('\n');
  let out='', i=0;
  while(i<lines.length){
    let ln = lines[i];
    if(/^```/.test(ln)){                                   // fenced code
      let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    if(/^\s*$/.test(ln)){ i++; continue; }                 // blank
    let h = ln.match(/^(#{1,4})\s+(.*)$/);                 // heading
    if(h){ const n=h[1].length; out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>'; i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ out+='<hr>'; i++; continue; }  // hr
    if(/^\s*>/.test(ln)){                                  // blockquote
      let buf=[];
      while(i<lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out+='<blockquote>'+renderMD(buf.join('\n'))+'</blockquote>'; continue;
    }
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){ // table
      const head=splitRow(ln); i+=2; let rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && lines[i].trim()!==''){ rows.push(splitRow(lines[i])); i++; }
      out+='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; continue;
    }
    if(/^\s*(?:[-*+]|\d+\.)\s+/.test(ln)){                 // list
      const ordered=/^\s*\d+\./.test(ln); let buf=[];
      while(i<lines.length && /^\s*(?:[-*+]|\d+\.)\s+/.test(lines[i])){
        buf.push('<li>'+inline(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/,''))+'</li>'); i++;
      }
      out+=(ordered?'<ol>':'<ul>')+buf.join('')+(ordered?'</ol>':'</ul>'); continue;
    }
    let buf=[];                                            // paragraph
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|```|\s*>|\s*([-*_])\2{2,}\s*$)/.test(lines[i])
          && !(/\|/.test(lines[i]) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1]))
          && !/^\s*(?:[-*+]|\d+\.)\s+/.test(lines[i])){ buf.push(lines[i]); i++; }
    out+='<p>'+inline(buf.join(' '))+'</p>';
  }
  return out;
}

function splitFrontmatter(md){
  const m = md.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){ return {fm:m[1].trim(), body:md.slice(m[0].length)}; }
  return {fm:null, body:md};
}

const vbar = document.getElementById('vbar');
const vnote = document.getElementById('vnote');

async function loadInto(path){
  docEl.innerHTML = '<div class="loading">불러오는 중…</div>';
  try{
    const res = await fetchData(path);
    if(!res.ok) throw new Error(res.status);
    const raw = await res.text();
    const {fm, body} = splitFrontmatter(raw);
    let html = '';
    if(fm){ html += '<div class="fm">'+esc(fm).replace(/\n/g,'<br>')+'</div>'; }
    html += renderMD(body);
    docEl.innerHTML = html; docEl.scrollTop = 0;
  }catch(e){
    docEl.innerHTML = '<p class="loading">파일을 불러오지 못했어요 ('+e.message+').<br>'+
      '이 페이지는 GitHub Pages 주소로 열어야 작동해요 (파일을 직접 열면 안 돼요).</p>';
  }
}
function openReader(kindLabel){
  rkind.textContent = kindLabel;
  overlay.classList.add('on'); document.body.style.overflow='hidden';
  document.querySelector('.reader').scrollIntoView({block:'start'});
}
// draft with version history
function openDraft(post){
  const vs = post.versions || [];
  openReader('초안 · '+(post.type||''));
  vbar.style.display = vs.length>1 ? 'flex' : 'none';
  function pick(i){
    vbar.querySelectorAll('.vchip').forEach((c,ci)=>c.classList.toggle('on',ci===i));
    if(vs[i].note){ vnote.style.display='block'; vnote.textContent='변경 · '+vs[i].note; }
    else vnote.style.display='none';
    loadInto(vs[i].path);
  }
  vbar.innerHTML = vs.map((v,i)=>'<button class="vchip">'+v.v+(i===0?' · 최신':'')+'</button>').join('');
  vbar.querySelectorAll('.vchip').forEach((c,i)=> c.onclick=()=>pick(i));
  if(vs.length){ pick(0); } else { vnote.style.display='none'; loadInto(post.draft||''); }
}
// single doc (research note)
function openSingle(path, label){
  openReader(label);
  vbar.style.display='none'; vnote.style.display='none';
  loadInto(path);
}
function closeDoc(){ overlay.classList.remove('on'); document.body.style.overflow=''; }
document.getElementById('close').onclick = closeDoc;
overlay.onclick = e=>{ if(e.target===overlay) closeDoc(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDoc(); });

const STAGE_AUTO = {'인박스':1,'검토중':0,'선정':0,'조사중':0,'작성중':0,'검수중':0,'발행':0};

function renderPipe(stages, posts){
  const pipe = document.getElementById('pipe');
  const counts = {};
  stages.forEach(s=>counts[s]=0);
  posts.forEach(p=>{ if(counts[p.stage]!==undefined) counts[p.stage]++; });
  pipe.innerHTML = stages.map((s,i)=>{
    const c = counts[s];
    return '<div class="step'+(STAGE_AUTO[s]?' auto':'')+'">'+
      '<div class="n mono">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="name">'+s+'</div>'+
      '<div class="cnt">'+(c? c+'건':'')+'</div></div>';
  }).join('');
}

// ---- 탭 전환 ----
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
    const which = t.getAttribute('data-tab');
    document.getElementById('tab-overview').hidden = which!=='overview';
    document.getElementById('tab-calendar').hidden = which!=='calendar';
  };
});

// ---- 수집 달력 (월별/주간) ----
const CWD = ['일','월','화','수','목','금','토'];
let INBOX = [], itemsByDate = {}, UNDATED = [];
let DEFAULT_ANCHOR = new Date();
let calState = { mode:'month', anchor:new Date() };

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseYMD(b)-parseYMD(a))/86400000); }

function chipHTML(it, wrap){
  const cls = it.article ? 'art' : (it.verified ? 'ok' : 'warn');
  return '<button class="chip '+cls+(wrap?' wk':'')+'" data-idx="'+it._idx+'">'+(it.article?'📄 ':'')+esc(it.title)+'</button>';
}
function itemDetailHTML(it){
  const vok = it.verified;
  let gap;
  if(it.firstSeen && it.surfaced && it.surfaced!==it.firstSeen){
    gap = '첫 등장 <b>'+it.firstSeen+'</b> · 확산 '+it.surfaced+' → ⏱ <b>'+daysBetween(it.firstSeen,it.surfaced)+'일 늦게 떴음</b>';
  } else if(it.firstSeen){ gap = '첫 등장 <b>'+it.firstSeen+'</b> · 같은 날 확산'; }
  else { gap = '단일 첫 등장일 없음 (지속·트렌드 또는 미검증)'; }
  const tags = (it.tags||[]).map(t=>'<span class="caltag">#'+esc(t)+'</span>').join('');
  const src = it.source ? '<a class="src" href="'+it.source+'" target="_blank" rel="noopener">출처 ↗</a>' : '';
  const post = it.postId ? '<span class="caltag">→ 글로 발전</span>' : '';
  const kill = it.killReason ? '<span class="caltag">✕ '+esc(it.killReason)+'</span>' : '';
  return '<div class="idetail">'+
    '<h1 style="font-size:19px">'+esc(it.title)+'</h1>'+
    '<div class="drow"><span class="vchk '+(vok?'ok':'warn')+'">'+(vok?'✅ 검증됨':'⚠️ 검증 필요')+'</span></div>'+
    '<div class="drow gap">'+gap+'</div>'+
    (it.verifyNote?'<div class="note">🔎 '+esc(it.verifyNote)+'</div>':'')+
    '<div class="meta"><span class="st '+it.status+'">'+it.status+'</span>'+tags+src+post+kill+'</div>'+
  '</div>';
}
function openItem(it){
  openReader(it.article ? '수집 항목 · 정리' : '수집 항목');
  document.getElementById('vbar').style.display='none';
  document.getElementById('vnote').style.display='none';
  if(it.article){ loadInto(it.article); }   // 자세히 정리한 글이 있으면 그걸 렌더
  else { docEl.innerHTML = itemDetailHTML(it); docEl.scrollTop = 0; }
}
function renderMonth(){
  const a=calState.anchor, y=a.getFullYear(), mo=a.getMonth();
  const firstDay=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate();
  const weeks=Math.ceil((firstDay+dim)/7);
  const start=new Date(y,mo,1-firstDay);
  let head=CWD.map((w,i)=>'<div class="mwd'+(i===0?' sun':'')+'">'+w+'</div>').join('');
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const inM=d.getMonth()===mo;
    const its=inM ? (itemsByDate[ymd(d)]||[]) : [];
    cells+='<div class="cell'+(inM?'':' off')+'"><div class="dn">'+d.getDate()+'</div>'+its.map(it=>chipHTML(it)).join('')+'</div>';
  }
  return '<div class="mgrid">'+head+cells+'</div>';
}
function renderWeek(){
  const a=calState.anchor, sun=new Date(a); sun.setDate(a.getDate()-a.getDay());
  let rows='';
  for(let i=0;i<7;i++){ const d=new Date(sun); d.setDate(sun.getDate()+i);
    const its=itemsByDate[ymd(d)]||[];
    const body=its.length?its.map(it=>chipHTML(it,true)).join(''):'<span class="wempty">—</span>';
    rows+='<div class="wday'+(i===0?' sun':'')+'"><div class="wh">'+CWD[d.getDay()]+'<small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small></div><div class="witems">'+body+'</div></div>';
  }
  return '<div class="wgrid">'+rows+'</div>';
}
function renderCalendar(){
  const view=document.getElementById('calview'); const a=calState.anchor;
  let label;
  if(calState.mode==='month'){ view.innerHTML=renderMonth(); label=a.getFullYear()+'년 '+(a.getMonth()+1)+'월'; }
  else { view.innerHTML=renderWeek(); const s=new Date(a);s.setDate(a.getDate()-a.getDay()); const e=new Date(s);e.setDate(s.getDate()+6);
    label=(s.getMonth()+1)+'/'+s.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate(); }
  document.getElementById('calLabel').textContent=label;
  view.querySelectorAll('.chip[data-idx]').forEach(b=>b.onclick=()=>openItem(INBOX[+b.getAttribute('data-idx')]));
}
function renderUndated(){
  const el=document.getElementById('calUndated');
  el.innerHTML = UNDATED.length ? '<div class="uchips">'+UNDATED.map(it=>chipHTML(it,true)).join('')+'</div>' : '<span class="wempty">없음</span>';
  el.querySelectorAll('.chip[data-idx]').forEach(b=>b.onclick=()=>openItem(INBOX[+b.getAttribute('data-idx')]));
}
function initCalendar(data){
  INBOX = (data && data.items) || [];
  itemsByDate = {}; UNDATED = [];
  INBOX.forEach((it,idx)=>{ it._idx=idx;
    if(it.firstSeen){ (itemsByDate[it.firstSeen]=itemsByDate[it.firstSeen]||[]).push(it); }
    else UNDATED.push(it);
  });
  const dates=Object.keys(itemsByDate).sort();
  DEFAULT_ANCHOR = dates.length ? parseYMD(dates[dates.length-1]) : new Date();
  calState = { mode:'month', anchor:new Date(DEFAULT_ANCHOR) };
  // 컨트롤 배선 (한 번)
  document.getElementById('calPrev').onclick = ()=>{ const a=calState.anchor;
    if(calState.mode==='month') a.setMonth(a.getMonth()-1); else a.setDate(a.getDate()-7); renderCalendar(); };
  document.getElementById('calNext').onclick = ()=>{ const a=calState.anchor;
    if(calState.mode==='month') a.setMonth(a.getMonth()+1); else a.setDate(a.getDate()+7); renderCalendar(); };
  document.getElementById('calToday').onclick = ()=>{ calState.anchor=new Date(DEFAULT_ANCHOR); renderCalendar(); };
  document.querySelectorAll('.vtg').forEach(v=>{ v.onclick=()=>{
    calState.mode=v.getAttribute('data-view');
    document.querySelectorAll('.vtg').forEach(x=>x.classList.toggle('on', x===v));
    renderCalendar();
  }; });
  renderCalendar();
  renderUndated();
}

const POSTS = {};
function card(p){
  const lens = (p.lens||[]).join(' · ');
  const nver = (p.versions||[]).length;
  const latest = nver ? p.versions[0].v : '';
  let a = '<div class="actions">';
  if(nver || p.draft) a += '<button class="primary" data-draft="'+p.id+'">📝 초안 보기'+(latest?' ('+latest+')':'')+'</button>';
  if(p.pipeline)      a += '<button data-doc="'+p.pipeline+'" data-label="🧭 제작 과정">🧭 제작 과정</button>';
  if(p.research)      a += '<button data-doc="'+p.research+'" data-label="🔍 조사 노트">🔍 조사 노트</button>';
  a += '</div>';
  const vtag = nver>1 ? '<span class="badge">버전 '+nver+'개</span>' : '';
  return '<div class="card">'+
    '<div class="top">'+
      '<span class="badge stage">'+p.stage+'</span>'+
      (p.type?'<span class="badge">'+p.type+'</span>':'')+
      vtag+
      '<span class="badge date mono">'+(p.date||'')+'</span>'+
    '</div>'+
    '<h3>'+p.title+'</h3>'+
    (p.angle?'<div class="angle">관점 · '+p.angle+'</div>':'')+
    (lens?'<div class="lens">렌즈 '+lens+'</div>':'')+
    a+'</div>';
}

async function boot(){
  try{
    const res = await fetchData('posts.json');
    const data = await res.json();
    document.getElementById('updated').textContent = '마지막 업데이트 '+ (data.updated||'') ;
    const stages = data.stages || ['인박스','검토중','선정','조사중','작성중','검수중','발행'];
    const posts = data.posts || [];
    posts.forEach(p=>{ POSTS[p.id]=p; });
    renderPipe(stages, posts);

    // 수집 달력
    try{ const ir = await fetchData('inbox.json'); initCalendar(await ir.json()); }
    catch(_){ document.getElementById('calview').innerHTML='<div class="empty">수집 달력을 불러오지 못했어요.</div>'; }

    // 판단 기준 (시스템 규칙)
    const crit = document.getElementById('criteria');
    const criteria = data.criteria || [];
    crit.innerHTML = criteria.map(c=>'<button class="critbtn" data-doc="'+c.path+'" data-label="'+c.name+'">'+c.name+'</button>').join('');

    const list = document.getElementById('list');
    list.innerHTML = posts.length ? posts.map(card).join('') :
      '<div class="empty">아직 글이 없어요. 새 글을 만들면 여기에 나타납니다.</div>';
    list.querySelectorAll('button[data-draft]').forEach(b=>{
      b.onclick = ()=> openDraft(POSTS[b.getAttribute('data-draft')]);
    });
    document.querySelectorAll('button[data-doc]').forEach(b=>{
      b.onclick = ()=> openSingle(b.getAttribute('data-doc'), b.getAttribute('data-label')||'문서');
    });
  }catch(e){
    document.getElementById('list').innerHTML =
      '<div class="empty">목록을 불러오지 못했어요.<br>GitHub Pages 주소로 열었는지 확인해주세요.</div>';
    document.getElementById('updated').textContent='';
  }
}
boot();
</script>
